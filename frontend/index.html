<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortune Anukposi Quantitative Macro Terminal</title>
    <meta name="author" content="Fortune Anukposi" />
    <meta name="copyright" content="© 2026 Fortune Anukposi. All rights reserved." />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('terminal-theme-mode');
          var saved = localStorage.getItem('terminal-theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme;
          if (mode === 'light' || (!mode && saved === 'light')) {
            theme = 'light';
          } else if (mode === 'dark' || (!mode && saved === 'dark')) {
            theme = 'dark';
          } else {
            theme = systemDark ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-theme-mode', mode || 'auto');
          document.documentElement.className = 'theme-' + theme;
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
